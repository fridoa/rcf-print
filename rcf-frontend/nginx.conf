# Konfigurasi nginx untuk build produksi FE.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip untuk aset teks. Bundle React tanpa ini bisa 3-4x lebih besar
    # di kabel.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;

    # Aset hasil build Vite punya hash di namanya, jadi aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html JANGAN di-cache: kalau di-cache, browser terus memuat
    # index lama yang menunjuk file assets yang sudah tidak ada setelah deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback — react-router menangani rutenya di sisi klien.
    # Tanpa ini, refresh di /pelanggan menghasilkan 404 dari nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Meneruskan panggilan API ke container backend, jadi FE dan BE
    # satu origin dan tidak perlu CORS di produksi.
    # Nama host "backend" diselesaikan oleh DNS internal docker network.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sembunyikan versi nginx dari response header.
    server_tokens off;
}
